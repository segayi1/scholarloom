name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: >-
          python -m unittest -v
          test_evidence.py
          test_pipeline.py
          test_server.py
          test_memory.py
          test_figure.py
          test_dossier.py
          test_local_translation.py
          test_deep_read.py
          test_external_context.py
          test_full_read.py
          test_library_search.py
          test_matrix.py
          test_session_store.py
          test_project_synthesis.py
          test_backup_restore.py

  javascript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node --check web/app.js
      - run: node --check web/translation.js
      - run: node test_web.js
      - run: node test_translation.js

  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Launcher decisions
        shell: powershell
        run: .\test_launch_desktop.ps1
